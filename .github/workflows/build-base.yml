name: Build Base

on:
  workflow_call:

jobs:
  pyinstaller:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [
          'windows-2025', 'windows-11-arm',
          'macos-15-intel', 'macos-15'
        ]
      fail-fast: false
      max-parallel: 3
    env:
      UV_SYSTEM_PYTHON: 1

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version-file: "pyproject.toml"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        enable-cache: true

    - name: Dependencies and build tools
      run: uv sync --extra pyinstaller_build --no-install-local

    - name: Optional dependencies (WebView)
      run: uv sync --extra webview --no-install-local --inexact
      if: runner.os != 'macOS'

    - name: Set strip option on non-Windows
      id: strip
      run: echo "option=--strip" >> $GITHUB_OUTPUT
      if: runner.os != 'Windows'

    - name: Build
      working-directory: legendary
      shell: bash
      run: |
        OS_NAME="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
        ARCH_RAW="$(uname -m 2>/dev/null || echo "$RUNNER_ARCH")"
        ARCH_NAME="$(echo "$ARCH_RAW" | tr '[:upper:]' '[:lower:]')"
        uv run --module PyInstaller \
        --onefile \
        --name legendary_${OS_NAME}_${ARCH_NAME} \
        ${{ steps.strip.outputs.option }} \
        -i ../assets/windows_icon.ico \
        cli.py
      env:
        PYTHONOPTIMIZE: 1

    - uses: actions/upload-artifact@v7
      with:
        name: legendary-${{ matrix.os }}
        path: legendary/dist/*

  zipapp:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [
          'ubuntu-24.04', 'ubuntu-24.04-arm'
        ]
      fail-fast: false

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version-file: "pyproject.toml"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        enable-cache: true

    - run: mkdir -p build dist

    - name: Dependencies
      run: uv export --format requirements.txt --no-editable --no-dev | uv pip install --requirement - --target build

    - run: cp zipapp_main.py build/__main__.py

    - name: Build
      run: |
        OS_NAME="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
        ARCH_RAW="$(uname -m 2>/dev/null || echo "$RUNNER_ARCH")"
        ARCH_NAME="$(echo "$ARCH_RAW" | tr '[:upper:]' '[:lower:]')"
        python -m zipapp \
        --output dist/legendary_${OS_NAME}_${ARCH_NAME} \
        --python "/usr/bin/env python3" \
        --compress \
        build

    - uses: actions/upload-artifact@v7
      with:
        name: legendary-${{ matrix.os }}
        path: dist/*
  release:
    needs: [pyinstaller, zipapp]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          
      - name: Prepare files for release
        run: |
          mkdir -p release_files
          find dist -type f -exec cp {} release_files/ \;
          echo "Files prepared for release:"
          ls -lh release_files

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: release_files/*